name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check desktop/plugin.js

      - name: Python syntax + YAML + prompt tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml --quiet
      - run: |
          python -c "
          import ast, pathlib, yaml
          for p in pathlib.Path('.').rglob('*.py'):
              ast.parse(p.read_text(encoding='utf-8'))
          print('python ok')
          yaml.safe_load(open('plugin.yaml').read())
          print('yaml ok')
          "
      - run: python tests/test_prompts.py
