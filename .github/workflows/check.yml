name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check desktop/plugin.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import ast, pathlib; ast.parse(pathlib.Path('__init__.py').read_text(encoding='utf-8'))"
