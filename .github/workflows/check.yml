name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node syntax check
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check desktop/plugin.js
      - name: Python syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').rglob('*.py')]"
      - name: YAML validation
        run: python -c "import yaml,sys; yaml.safe_load(open('plugin.yaml')); print('yaml ok')"
